name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/example/karaokeapp
        mkdir -p gradle/wrapper

        if [ -f "MainActivity.txt" ]; then
          cp MainActivity.txt app/src/main/java/com/example/karaokeapp/MainActivity.kt
        elif [ -f "MainActivity.kt" ]; then
          cp MainActivity.kt app/src/main/java/com/example/karaokeapp/MainActivity.kt
        else
          echo "package com.example.karaokeapp" > app/src/main/java/com/example/karaokeapp/MainActivity.kt
          echo "" >> app/src/main/java/com/example/karaokeapp/MainActivity.kt
          echo "import android.os.Bundle" >> app/src/main/java/com/example/karaokeapp/MainActivity.kt
          echo "import androidx.appcompat.app.AppCompatActivity" >> app/src/main/java/com/example/karaokeapp/MainActivity.kt
          echo "" >> app/src/main/java/com/example/karaokeapp/MainActivity.kt
          echo "class MainActivity : AppCompatActivity() {" >> app/src/main/java/com/example/karaokeapp/MainActivity.kt
          echo "    override fun onCreate(savedInstanceState: Bundle?) {" >> app/src/main/java/com/example/karaokeapp/MainActivity.kt
          echo "        super.onCreate(savedInstanceState)" >> app/src/main/java/com/example/karaokeapp/MainActivity.kt
          echo "    }" >> app/src/main/java/com/example/karaokeapp/MainActivity.kt
          echo "}" >> app/src/main/java/com/example/karaokeapp/MainActivity.kt
        fi

        if ! grep -q "package com.example.karaokeapp" app/src/main/java/com/example/karaokeapp/MainActivity.kt; then
          sed -i '1i package com.example.karaokeapp' app/src/main/java/com/example/karaokeapp/MainActivity.kt
        fi

        echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
        echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.karaokeapp">' >> app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>' >> app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.INTERNET"/>' >> app/src/main/AndroidManifest.xml
        echo '    <application android:allowBackup="true" android:icon="@android:drawable/sym_def_app_icon" android:label="Karaoke App" android:theme="@android:style/Theme.MaterialComponents.DayNight.NoActionBar">' >> app/src/main/AndroidManifest.xml
        echo '        <activity android:name=".MainActivity" android:exported="true">' >> app/src/main/AndroidManifest.xml
        echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '                <action android:name="android.intent.action.MAIN"/>' >> app/src/main/AndroidManifest.xml
        echo '                <category android:name="android.intent.category.LAUNCHER"/>' >> app/src/main/AndroidManifest.xml
        echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '        </activity>' >> app/src/main/AndroidManifest.xml
        echo '    </application>' >> app/src/main/AndroidManifest.xml
        echo '</manifest>' >> app/src/main/AndroidManifest.xml

        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
        echo "rootProject.name = 'KaraokeApp'" >> settings.gradle
        echo "include ':app'" >> settings.gradle

        echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.1.1'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20' } }" > build.gradle

        echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }" > app/build.gradle
        echo "android {" >> app/build.gradle
        echo "    namespace 'com.example.karaokeapp'" >> app/build.gradle
        echo "    compileSdk 34" >> app/build.gradle
        echo "    defaultConfig { applicationId 'com.example.karaokeapp'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' }" >> app/build.gradle
        echo "    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }" >> app/build.gradle
        echo "    kotlinOptions { jvmTarget = '17' }" >> app/build.gradle
        echo "    buildFeatures { compose true }" >> app/build.gradle
        echo "    composeOptions { kotlinCompilerExtensionVersion '1.5.4' }" >> app/build.gradle
        echo "}" >> app/build.gradle
        echo "dependencies {" >> app/build.gradle
        echo "    implementation 'androidx.core:core-ktx:1.12.0'" >> app/build.gradle
        echo "    implementation 'androidx.appcompat:appcompat:1.6.1'" >> app/build.gradle
        echo "    implementation 'com.google.android.material:material:1.10.0'" >> app/build.gradle
        echo "    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'" >> app/build.gradle
        echo "    implementation 'androidx.activity:activity-compose:1.8.2'" >> app/build.gradle
        echo "    implementation platform('androidx.compose:compose-bom:2024.02.00')" >> app/build.gradle
        echo "    implementation 'androidx.compose.ui:ui'" >> app/build.gradle
        echo "    implementation 'androidx.compose.ui:ui-graphics'" >> app/build.gradle
        echo "    implementation 'androidx.compose.ui:ui-tooling-preview'" >> app/build.gradle
        echo "    implementation 'androidx.compose.material3:material3'" >> app/build.gradle
        echo "    implementation 'androidx.compose.material:material'" >> app/build.gradle
        echo "    implementation 'androidx.compose.material:material-icons-extended'" >> app/build.gradle
        echo "}" >> app/build.gradle

        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

    - name: Setup Gradle Action
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KaraokeApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
