name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Clean & Auto Create Structure
      run: |
        rm -rf app build.gradle settings.gradle

        # 1. Root settings.gradle
        printf "pluginManagement {\n  repositories {\n    google()\n    mavenCentral()\n    gradlePluginPortal()\n  }\n}\ndependencyResolutionManagement {\n  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n  repositories {\n    google()\n    mavenCentral()\n  }\n}\nrootProject.name = 'KaraokeApp'\ninclude ':app'\n" > settings.gradle

        # 2. Root build.gradle
        printf "buildscript {\n  repositories {\n    google()\n    mavenCentral()\n  }\n  dependencies {\n    classpath 'com.android.tools.build:gradle:8.1.1'\n    classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'\n  }\n}\n" > build.gradle

        # 3. App structure
        mkdir -p app/src/main/java/com/example/karaokeapp

        if [ -f "MainActivity.txt" ]; then
          cp MainActivity.txt app/src/main/java/com/example/karaokeapp/MainActivity.kt
        elif [ -f "MainActivity.kt" ]; then
          cp MainActivity.kt app/src/main/java/com/example/karaokeapp/MainActivity.kt
        fi

        # 4. AndroidManifest.xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.karaokeapp">\n  <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n  <uses-permission android:name="android.permission.INTERNET"/>\n  <application android:allowBackup="true" android:icon="@android:drawable/sym_def_app_icon" android:label="Karaoke App" android:theme="@android:style/Theme.MaterialComponents.DayNight.NoActionBar">\n    <activity android:name=".MainActivity" android:exported="true">\n      <intent-filter>\n        <action android:name="android.intent.action.MAIN"/>\n        <category android:name="android.intent.category.LAUNCHER"/>\n      </intent-filter>\n    </activity>\n  </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml

        # 5. app/build.gradle
        printf "plugins {\n  id 'com.android.application'\n  id 'org.jetbrains.kotlin.android'\n}\n\nandroid {\n  namespace 'com.example.karaokeapp'\n  compileSdk 34\n  defaultConfig {\n    applicationId 'com.example.karaokeapp'\n    minSdk 24\n    targetSdk 34\n    versionCode 1\n    versionName '1.0'\n  }\n  compileOptions {\n    sourceCompatibility JavaVersion.VERSION_17\n    targetCompatibility JavaVersion.VERSION_17\n  }\n  kotlinOptions {\n    jvmTarget = '17'\n  }\n  buildFeatures {\n    compose true\n  }\n  composeOptions {\n    kotlinCompilerExtensionVersion '1.5.4'\n  }\n}\n\ndependencies {\n  implementation 'androidx.core:core-ktx:1.12.0'\n  implementation 'androidx.appcompat:appcompat:1.6.1'\n  implementation 'com.google.android.material:material:1.10.0'\n  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'\n  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'\n  implementation 'androidx.activity:activity-compose:1.8.2'\n  implementation platform('androidx.compose:compose-bom:2023.08.00')\n  implementation 'androidx.compose.ui:ui'\n  implementation 'androidx.compose.ui:ui-graphics'\n  implementation 'androidx.compose.ui:ui-tooling-preview'\n  implementation 'androidx.compose.material3:material3'\n  implementation 'androidx.compose.material:material'\n}\n" > app/build.gradle

    - name: Build with Gradle
      uses: gradle/gradle-build-action@v2
      with:
        arguments: assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KaraokeApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
